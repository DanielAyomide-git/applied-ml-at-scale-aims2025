<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Movie Recommender</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #toast { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .star-filled { color: #eab308; }
    .star-empty { color: #374151; }
    .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #dc2626;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #modal { transition: opacity 0.2s ease-in-out; }
    .scroll-smooth { scroll-behavior: smooth; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .star-btn { cursor: pointer; transition: transform 0.1s; touch-action: manipulation; }
    .star-btn:active { transform: scale(1.2); }
  </style>
</head>
<body class="bg-black text-gray-200">

<script>
    if (performance.getEntriesByType("navigation")[0].type === "reload") {
        localStorage.clear();
    }
</script>

<div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-80 z-[100] hidden flex flex-col items-center justify-center p-4 text-center">
    <div class="loader mb-4"></div>
    <p id="loadingText" class="text-white font-bold text-lg md:text-xl">AI is thinking...</p>
</div>

<div id="toast" class="fixed top-10 left-1/2 -translate-x-1/2 bg-green-600 text-white px-8 py-4 rounded-full shadow-2xl opacity-0 pointer-events-none z-[110] transform -translate-y-10 text-center">
    ✨ Recommendations Updated!
</div>

<div class="max-w-7xl mx-auto p-4 md:p-6">
  <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-6">
    <img src="../static/logo.png" alt="AI RECS" class="h-128 md:h-128 w-auto cursor-pointer object-contain" onclick="location.reload()" 
         onerror="this.outerHTML='<h1 class=\'text-4xl font-bold text-red-600 cursor-pointer\' onclick=\'location.reload()\'>🎬 AI RECS</h1>'">
    
    <div class="relative w-full md:w-1/2 lg:w-1/3">
      <input id="searchBox" placeholder="Search movies to rate..." 
        class="w-full p-4 pr-12 rounded-full bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-red-500 shadow-inner text-sm md:text-base"/>
      <button id="clearSearch" class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white hidden text-2xl font-bold">&times;</button>
    </div>
  </header>


  <div id="searchContainer" class="hidden mb-12">
    <h2 class="text-xl md:text-2xl font-semibold mb-6 text-red-500 border-l-4 border-red-500 pl-4">Search Results</h2>
    <div id="searchResults" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6"></div>
  </div>

  <div class="mb-12 relative group/ads">
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-[0.2em]">Latest Releases</h2>
            <span class="text-[10px] px-1.5 py-0.5 rounded border border-gray-800 text-gray-600 font-medium">OMDb</span>
        </div>
    </div>
    <div id="adsSection" class="flex overflow-x-auto gap-4 snap-x snap-mandatory scrollbar-hide pb-2 scroll-smooth">
        <p class="text-gray-600 text-sm py-4">Loading latest releases...</p>
    </div>
  </div>


  <div id="recContainer" class="hidden mb-12">
    <h2 class="text-xl md:text-2xl font-bold mb-6 flex items-center gap-2 text-white border-l-4 border-red-600 pl-4">
        <span class="bg-red-600 text-xs px-2 py-1 rounded">AI</span> Recommended for You
    </h2>
    <div id="recMovies" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6"></div>
  </div>

  <div id="popularContainer">
      <h2 class="text-xl md:text-2xl font-semibold mb-6 text-gray-400 border-l-4 border-gray-700 pl-4">Most Rated Movies</h2>
      <div id="popularMovies" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="fixed inset-0 bg-black bg-opacity-95 hidden items-center justify-center z-50 p-2 md:p-4">
  <div class="bg-gray-900 rounded-2xl overflow-hidden w-full max-w-4xl relative border border-gray-800 max-h-[95vh] overflow-y-auto">
    <button onclick="closeModal()" class="absolute top-2 right-4 text-white text-4xl z-10 hover:text-red-500">&times;</button>
    <div class="flex flex-col">
      <div id="trailerContainer" class="hidden aspect-video bg-black">
        <iframe id="trailer" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="p-5 md:p-8">
        <h2 id="modalTitle" class="text-2xl md:text-3xl font-bold mb-1"></h2>
        <p id="modalGenre" class="text-red-500 font-bold text-xs uppercase mb-4 tracking-widest"></p>
        <p id="modalPlot" class="text-sm md:text-base text-gray-400 mb-6 leading-relaxed"></p>
        
        <div id="ratingSection" class="flex flex-col sm:flex-row items-start sm:items-center gap-4 border-t border-gray-800 pt-6">
          <span class="font-bold text-red-500 text-sm md:text-base uppercase tracking-widest">Rate this Movie:</span>
          <div id="stars" class="flex text-3xl md:text-4xl gap-2" onmouseleave="resetStars()"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const OMDB_API_KEY = "{{ api_key }}"; 
const RATINGS_KEY = "movie_app_ratings";
const RECS_KEY = "movie_app_ai_recs"; 
let currentMovieID = null;
let isPaused = false;

const getRatings = () => JSON.parse(localStorage.getItem(RATINGS_KEY) || "{}");
const getStoredRecs = () => JSON.parse(localStorage.getItem(RECS_KEY) || "[]");

function toggleLoading(show, text = "AI is thinking...") {
    const overlay = document.getElementById("loadingOverlay");
    document.getElementById("loadingText").innerText = text;
    overlay.classList.toggle("hidden", !show);
}

function showToast() {
    const t = document.getElementById("toast");
    t.classList.replace("opacity-0", "opacity-100");
    t.classList.replace("-translate-y-10", "translate-y-0");
    setTimeout(() => {
        t.classList.replace("opacity-100", "opacity-0");
        t.classList.replace("translate-y-0", "-translate-y-10");
    }, 3000);
}

const searchBox = document.getElementById("searchBox");
const clearBtn = document.getElementById("clearSearch");

// FIX: CLEAR SEARCH BUTTON LOGIC
clearBtn.onclick = () => {
    searchBox.value = "";
    clearBtn.classList.add("hidden");
    document.getElementById("searchContainer").classList.add("hidden");
    document.getElementById("popularContainer").classList.remove("hidden");
    
    // Show AI Recs again if they exist
    if (getStoredRecs().length > 0) {
        document.getElementById("recContainer").classList.remove("hidden");
    }
};

async function fetchLatestReleases() {
    try {
        const response = await fetch(`https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&s=movie&y=2025&type=movie`);
        const data = await response.json();
        if (data.Search) {
            const adsContainer = document.getElementById('adsSection');
            adsContainer.innerHTML = "";
            data.Search.forEach(movie => {
                if (movie.Poster === "N/A") return;
                const ad = document.createElement("div");
                ad.className = "flex-none w-[85%] md:w-[calc(33.33%-11px)] snap-start group bg-gray-900/40 border border-gray-800 p-3 rounded-2xl flex items-center gap-4 hover:border-red-600 transition-all shadow-lg cursor-pointer";
                ad.innerHTML = `
                    <div class="w-16 h-16 flex-shrink-0 overflow-hidden rounded-xl border border-gray-700">
                        <img src="${movie.Poster}" alt="" class="w-full h-full object-cover">
                    </div>
                    <div class="overflow-hidden">
                        <h3 class="text-xs font-bold text-white uppercase tracking-wider truncate">${movie.Title}</h3>
                        <p class="text-[10px] text-gray-400 leading-tight">Featured • ${movie.Year}</p>
                    </div>
                `;
                ad.onclick = () => openMovie(movie.imdbID, true);
                adsContainer.appendChild(ad);
            });
            startAutoScroll();
        }
    } catch (err) { console.error("Ads error:", err); }
}

async function openMovie(imdbID, hideRating = false) {
    currentMovieID = imdbID;
    toggleLoading(true, "Fetching details...");
    try {
        const res = await fetch(`/api/movie?imdb_id=${imdbID}`);
        const data = await res.json();
        
        document.getElementById("modalTitle").innerText = data.movie.Title;
        document.getElementById("modalGenre").innerText = data.movie.Genre;
        document.getElementById("modalPlot").innerText = data.movie.Plot;
        
        // FIX: TRAILER SOURCE
        const trailer = document.getElementById("trailer");
        if (data.trailer) {
            trailer.src = `https://www.youtube.com/embed/${data.trailer}`;
            document.getElementById("trailerContainer").classList.remove("hidden");
        } else {
            trailer.src = "";
            document.getElementById("trailerContainer").classList.add("hidden");
        }

        const ratingSection = document.getElementById("ratingSection");
        if (hideRating) {
            ratingSection.classList.add("hidden");
        } else {
            ratingSection.classList.remove("hidden");
            resetStars();
        }

        document.getElementById("modal").classList.replace("hidden", "flex");
        document.body.style.overflow = "hidden";
    } finally {
        toggleLoading(false);
    }
}

function highlightStars(count) {
    const starsDiv = document.getElementById("stars");
    starsDiv.innerHTML = "";
    for (let i = 1; i <= 5; i++) {
        const s = document.createElement("span");
        s.innerHTML = "★";
        s.className = `star-btn transition ${i <= count ? 'star-filled' : 'star-empty'}`;
        
        s.onpointerdown = (e) => {
            e.preventDefault();
            saveRating(currentMovieID, i);
        };
        
        if (window.innerWidth > 768) {
            s.onmouseover = () => {
                const children = starsDiv.children;
                for(let j=0; j<5; j++) {
                    children[j].classList.toggle('star-filled', j < i);
                    children[j].classList.toggle('star-empty', j >= i);
                }
            };
        }
        starsDiv.appendChild(s);
    }
}

function resetStars() {
    const rating = getRatings()[currentMovieID] || 0;
    highlightStars(rating);
}

async function saveRating(id, rating) {
    const r = getRatings();
    r[id] = rating;
    localStorage.setItem(RATINGS_KEY, JSON.stringify(r));
    
    toggleLoading(true, "AI is learning your taste...");
    try {
        const res = await fetch("/api/recommend", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ratings: r })
        });
        const data = await res.json();
        
        if (data.recommendations && data.recommendations.length > 0) {
            const existingRecs = getStoredRecs();
            const ratedIds = Object.keys(r);
            
            // Filter: Combine, remove duplicates, and remove movies already rated
            const combined = [...data.recommendations, ...existingRecs].filter(m => {
                const mid = m.imdbID || m.imdb_id;
                return !ratedIds.includes(mid);
            });
            
            const unique = Array.from(new Map(combined.map(m => [m.imdbID || m.imdb_id, m])).values());
            const finalRecs = unique.slice(0, 50);
            
            localStorage.setItem(RECS_KEY, JSON.stringify(finalRecs));
            renderCards(finalRecs, document.getElementById("recMovies"), false);
            document.getElementById("recContainer").classList.remove("hidden");
            
            closeModal();
            showToast();
        }
    } catch (err) { console.error("AI Error:", err); } 
    finally { toggleLoading(false); }
}

function renderCards(list, container, hideRating = false) {
    container.innerHTML = "";
    list.forEach(m => {
        if (!m.Poster || m.Poster === "N/A") return;
        const imdbID = m.imdbID || m.imdb_id;
        const card = document.createElement("div");
        card.className = "bg-gray-900 rounded-xl overflow-hidden cursor-pointer hover:ring-2 hover:ring-red-600 transition transform hover:-translate-y-2 flex flex-col h-full shadow-lg";
        card.innerHTML = `
            <img src="${m.Poster}" class="w-full aspect-[2/3] object-cover" onerror="this.closest('.bg-gray-900').remove()"/>
            <div class="p-3 mt-auto"><p class="font-bold truncate text-xs md:text-sm text-white">${m.Title}</p><p class="text-[10px] md:text-xs text-gray-500">${m.Year}</p></div>
        `;
        card.onclick = () => openMovie(imdbID, hideRating);
        container.appendChild(card);
    });
}

function closeModal() {
    document.getElementById("modal").classList.replace("flex", "hidden");
    document.getElementById("trailer").src = "";
    document.body.style.overflow = "auto";
}

window.onload = async () => {
    toggleLoading(true, "Loading...");
    try {
        fetchLatestReleases();
        const popRes = await fetch('/api/popular');
        const popData = await popRes.json();
        renderCards(popData.movies, document.getElementById("popularMovies"), true);
        
        const savedRecs = getStoredRecs();
        const ratings = getRatings();
        const ratedIds = Object.keys(ratings);
        const filteredRecs = savedRecs.filter(m => !ratedIds.includes(m.imdbID || m.imdb_id));
        
        if(filteredRecs.length > 0) {
            renderCards(filteredRecs, document.getElementById("recMovies"), false);
            document.getElementById("recContainer").classList.remove("hidden");
        }
    } finally { toggleLoading(false); }
};

searchBox.oninput = async () => {
    const q = searchBox.value;
    clearBtn.classList.toggle("hidden", q.length === 0);
    if (q.length < 3) return;
    document.getElementById("popularContainer").classList.add("hidden");
    document.getElementById("recContainer").classList.add("hidden");
    document.getElementById("searchContainer").classList.remove("hidden");
    
    const res = await fetch(`/api/search?q=${q}`);
    const data = await res.json();
    renderCards(data.Search || [], document.getElementById("searchResults"), false);
};

function startAutoScroll() {
    const ads = document.getElementById('adsSection');
    setInterval(() => {
        if (isPaused || !ads.firstElementChild) return;
        if (ads.scrollLeft + ads.offsetWidth >= ads.scrollWidth - 10) {
            ads.scrollTo({ left: 0, behavior: 'smooth' });
        } else {
            ads.scrollBy({ left: 200, behavior: 'smooth' });
        }
    }, 3000);
}
</script>
</body>
</html>
